[package]
name = "OraclePlugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Oracle datasource plugin for DataTransfer (cdylib)"

[lib]
name = "oracle"
crate-type = ["cdylib"]

[dependencies]
LibDatasource = { path = "..", default-features = false }
oracle.workspace = true
chrono = { version = "0.4", features = ["serde"] }
log.workspace = true
