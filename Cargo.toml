[workspace]
resolver = "3"
members = [
    "LibDatasource",
    "LibDatasource/Mysql",
    "LibDatasource/Postgresql",
    "LibDatasource/Oracle",
    "LibETL",
    "LibETL/OrderSplitPlugin",
    "DataTransfer",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
cron = "0.13"
yaml-rust2 = "0.10"

# Database drivers used by datasource plugins (DataTransfer itself never depends on these)
mysql = "26"
postgres = "0.19"
r2d2 = "0.8"
r2d2_postgres = "0.18"
oracle = { version = "0.6", features = ["chrono"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
