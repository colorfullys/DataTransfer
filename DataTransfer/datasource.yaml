# Datasource connections. Passwords and sensitive params may use ${ENV_VAR}.
connections:
  mysql_db1:
    type: mysql
    host: 127.0.0.1
    port: 3306
    database: db1
    username: root
    password: 123456
    params:
      charset: utf8mb4
  mysql_db2:
    type: mysql
    host: 127.0.0.1
    port: 3306
    database: db2
    username: root
    password: 123456
    params:
      charset: utf8mb4

  pg_test:
    type: postgresql
    host: 192.168.1.20
    port: 5432
    database: test
    username: postgres
    password: ${PG_PASSWORD}
    params:
      ssl_mode: disable

