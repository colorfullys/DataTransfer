#${state.xxx}    同步状态
#${env.xxx}      环境变量
#${sys.xxx}      系统变量


name: user_sync

description: 用户同步任务

enabled: true

source:
  connection: mysql_db1
  table: sys_user
  # MAX_ID 是程序记录的， CURRENT_TIME('%Y-%m-%d %H:%M:%S') 当前时间格式化，-30S  减去30秒
  where :  |
       id > ${state.max_id}  or 
       create_time > ${sys.now('%Y-%m-%d %H:%M:%S') -30S} 
  primary_key:
      - id
  columns: id,name,age

target:
  connection: mysql_db2
  table: users

  primary_key: 
       - id
  columns: id,userName,age

sync:
  # full: TRUNCATE TABLE sys_user;
  # upsert: INSERT ...ON DUPLICATE KEY UPDATE ...
  mode: upsert 
  state:
    max_id:
      type: max
      column: id

schedule:
  cron: "0/3 * * * * *"

