name: user_sync
description: temp e2e verification job
enabled: true

# writer数量
writers: 3

source:
  connection: mysql_db1
  # 每次查询限制
  batch_limit: 20000
  #select 语句
  select: |
    SELECT * FROM sys_user
    where  user_id > ${state.max_user_id}
    or create_time > ${sys.now('%Y-%m-%d %H:%M:%S') -30S}
  #where: |
  #   user_id > ${state.max_user_id}
  #   or create_time > ${sys.now('%Y-%m-%d %H:%M:%S') -30S}
  primary_key:
    - user_id
  columns: user_id,user_name,create_time,login_name

target:
  connection: mysql_db1
  table: sys_user_copy1
  primary_key:
    - user_id
  columns: user_id,user_name,create_time,login_name

sync:
  mode: upsert
  state:
    max_user_id:
      type: max
      column: user_id

schedule:
  cron: "*/10 * * * * *"

